[project]
name = "sound-companion-server"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "alembic==1.20.0",
    "beautifulsoup4==4.15.0",
    "fastapi==0.150.0",
    "httpx==0.28.1",
    "langchain-postgres==0.0.19",
    "langchain-text-splitters==1.1.3",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.16.0",
    "sqlalchemy==2.1.5",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
