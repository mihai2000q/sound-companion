[project]
name = "sound-companion-server"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "alembic==1.20.0",
    "beautifulsoup4==4.15.0",
    "fastapi==0.150.0",
    "httpx==0.28.1",
    "langchain==1.4.6",
    "langchain-core==1.6.12",
    "langchain-openai==1.7.2",
    "langchain-postgres==0.0.19",
    "langchain-text-splitters==1.1.3",
    "langgraph==1.2.16",
    "langgraph-checkpoint-postgres==3.2.0",
    "music21==10.5.0",
    "psycopg[binary]==3.3.6",
    "pychord==1.4.1",
    "pydantic-settings==2.16.0",
    "sqlalchemy==2.1.5",
    "sse-starlette>=3.5.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]
ragas = [
    "ragas==0.4.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
